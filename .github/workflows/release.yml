name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build and verify npm packages
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Validate tag and package version
        id: version
        shell: bash
        run: |
          version="$(node scripts/release-plan.js --version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and pack all packages
        shell: bash
        run: |
          mkdir release-assets
          pnpm build
          pnpm pack:packages release-assets

      - name: Verify npm tarball contents
        shell: bash
        run: |
          node scripts/release-plan.js release-assets
          node scripts/check-package.js release-assets/*.tgz

      - name: Upload npm packages
        uses: actions/upload-artifact@v4
        with:
          name: npm-package-${{ steps.version.outputs.version }}
          path: release-assets/*.tgz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish npm packages and GitHub release
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out release history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Download npm packages
        uses: actions/download-artifact@v5
        with:
          name: npm-package-${{ needs.package.outputs.version }}
          path: release-assets

      - name: Publish packages to npm in dependency order
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          node scripts/release-plan.js release-assets > release-plan.tsv
          while IFS=$'\t' read -r package_name package_file integrity; do
            if npm view "${package_name}@${RELEASE_VERSION}" dist.integrity --json > registry-version.json 2> registry-error.txt; then
              published_integrity="$(node -p "require('./registry-version.json')")"
              if [[ "$published_integrity" != "$integrity" ]]; then
                echo "${package_name}@${RELEASE_VERSION} exists with different contents. Choose a new release version." >&2
                exit 1
              fi
              echo "${package_name}@${RELEASE_VERSION} already contains this exact artifact; skipping."
            else
              if ! node -e "if (require('./registry-version.json').error?.code !== 'E404') process.exit(1)"; then
                cat registry-error.txt >&2
                exit 1
              fi
              npm publish "$package_file" --access public
            fi
          done < release-plan.tsv

      - name: Create SHA-256 checksums
        shell: bash
        working-directory: release-assets
        run: sha256sum *.tgz > SHA256SUMS.txt

      - name: Generate changelog
        shell: bash
        run: |
          previous_tag="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          if [[ -n "$previous_tag" ]]; then
            revision_range="$previous_tag..$GITHUB_REF_NAME"
            heading="Changes since $previous_tag"
          else
            revision_range="$GITHUB_REF_NAME"
            heading="Changes in this release"
          fi

          {
            echo "## $heading"
            echo
            git log --no-merges --format='- %s (%h)' "$revision_range"
          } > release-notes.md

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              --title "Boring API $RELEASE_VERSION"
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --verify-tag \
              --notes-file release-notes.md \
              --title "Boring API $RELEASE_VERSION"
          fi
