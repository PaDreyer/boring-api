name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify version and tests
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Yarn
        run: npm install --global yarn@1.22.22

      - name: Validate tag and package version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          expected_tag="v${version}"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Tag '$GITHUB_REF_NAME' does not match package version '$expected_tag'." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check example application
        run: yarn example:check

      - name: Check TypeScript
        run: yarn typecheck

      - name: Run tests
        run: yarn test

      - name: Build package
        run: yarn build

  package:
    name: Build npm package
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Yarn
        run: npm install --global yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build npm tarball
        shell: bash
        run: |
          mkdir release-assets
          npm pack --pack-destination release-assets

      - name: Verify npm tarball contents
        shell: bash
        run: |
          package_file="$(find release-assets -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          if [[ -z "$package_file" ]]; then
            echo "npm pack did not create a tarball." >&2
            exit 1
          fi
          tar -xOf "$package_file" package/package.json > packed-package.json
          packed_version="$(node -p "require('./packed-package.json').version")"
          if [[ "$packed_version" != "${{ needs.verify.outputs.version }}" ]]; then
            echo "Packed version '$packed_version' does not match release version '${{ needs.verify.outputs.version }}'." >&2
            exit 1
          fi

      - name: Upload npm package
        uses: actions/upload-artifact@v4
        with:
          name: npm-package-${{ needs.verify.outputs.version }}
          path: release-assets/*.tgz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish npm package and GitHub release
    needs:
      - verify
      - package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out release history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Download npm package
        uses: actions/download-artifact@v5
        with:
          name: npm-package-${{ needs.verify.outputs.version }}
          path: release-assets

      - name: Publish package to npm
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_file="$(find release-assets -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          if [[ -z "$package_file" ]]; then
            echo "The npm package artifact is missing." >&2
            exit 1
          fi

          if npm view "${package_name}@${RELEASE_VERSION}" version --json >/dev/null 2>&1; then
            echo "${package_name}@${RELEASE_VERSION} is already published; skipping npm publish."
          else
            npm publish "$package_file" --access public
          fi

      - name: Create SHA-256 checksums
        shell: bash
        working-directory: release-assets
        run: sha256sum *.tgz > SHA256SUMS.txt

      - name: Generate changelog
        shell: bash
        run: |
          previous_tag="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          if [[ -n "$previous_tag" ]]; then
            revision_range="$previous_tag..$GITHUB_REF_NAME"
            heading="Changes since $previous_tag"
          else
            revision_range="$GITHUB_REF_NAME"
            heading="Changes in this release"
          fi

          {
            echo "## $heading"
            echo
            git log --no-merges --format='- %s (%h)' "$revision_range"
          } > release-notes.md

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              --title "Boring API $RELEASE_VERSION"
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --verify-tag \
              --notes-file release-notes.md \
              --title "Boring API $RELEASE_VERSION"
          fi
