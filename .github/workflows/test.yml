name: Tests

on:
  pull_request:
  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "18"
          - "20"
          - "22"
          - "24"
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Check example application
        run: pnpm example:check

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build basic example
        run: pnpm example:build

      - name: Build fullstack example
        if: matrix.node-version == '24'
        run: pnpm example:fullstack:build

      - name: Verify packed core package
        if: matrix.node-version == '24'
        run: |
          mkdir release-assets
          pnpm --filter @boringapi/core pack --pack-destination release-assets
          node scripts/check-package.js release-assets/*.tgz

      - name: Verify production-only installation
        run: |
          pnpm install --prod --frozen-lockfile
          pnpm --filter @boringapi/example-basic exec boring --help
